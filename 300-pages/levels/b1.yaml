# Level B1 — explanation line on every task, slightly denser
level: b1
name: B1
cefr: Intermediate
exam: "Goethe-Zertifikat B1 · telc Deutsch B1"
hue: 12                 # centre of this level's 50° slice of the colour wheel
cover: [0.57, 0.2, 16]   # OKLCH of the cover field; cream type must reach 3:1 on it

# Level scaling — one place to make a book airier or denser.
type:
  body: 10.25             # pt
  baseline: 14.5         # pt; every vertical measure is a multiple of half a baseline
  body_lines: 47          # baselines per page (47 × 14.5 pt)
  hand: 16             # pt, handwriting model answers
  write_line: 1.5        # baselines between ruled write-in lines (1.5 keeps the page on the grid)
explanation: always        # always | new  (new = only the first time a task type appears in a chapter)
reading_columns: 1

# What --sample puts into the free sample (folios; front matter and sales page are always included)
sample:
  pages: [101, 102, 103, 104, 105, 106, 107, 120, 121, 122, 123]   # opener, three spreads, overview spread, test spread
  appendix: [L 1, W 1]
