# Level A2 — explanation line on every task
level: a2
name: A2
cefr: Elementary
exam: "Goethe-Zertifikat A2 · telc Deutsch A2"
hue: 58                 # centre of this level's 50° slice of the colour wheel
cover: [0.64, 0.19, 46]   # OKLCH of the cover field; cream type must reach 3:1 on it

# Level scaling — one place to make a book airier or denser.
type:
  body: 10.5             # pt
  baseline: 15.0         # pt; every vertical measure is a multiple of half a baseline
  body_lines: 46          # baselines per page (46 × 15.0 pt)
  hand: 16.5             # pt, handwriting model answers
  write_line: 8.0        # mm, pitch of ruled write-in lines
explanation: always        # always | new  (new = only the first time a task type appears in a chapter)
reading_columns: 1

# What --sample puts into the free sample (folios; front matter and sales page are always included)
sample:
  pages: [101, 102, 103, 104, 105, 106, 107, 120, 122]
  appendix: [L 1, W 1]
