  mert:  {de: "Ingenieur. Er wohnt in Berlin – und ist in jedem Kapitel dabei.", en: "An engineer. He lives in Berlin – and he is part of every chapter.", tr: "Mühendis. Berlin’de yaşıyor ve her bölümde karşına çıkıyor."}
  clara: {de: "Grafikerin. Sie wohnt in Wien, in einer kleinen Wohnung.", en: "A graphic designer. She lives in Vienna, in a small flat.", tr: "Grafik tasarımcı. Viyana’da küçük bir dairede yaşıyor."}
  tom:   {de: "Student. Er kommt aus Wien und wohnt jetzt in Hamburg.", en: "A student. He comes from Vienna and now lives in Hamburg.", tr: "Üniversite öğrencisi. Viyanalı, şimdi Hamburg’da yaşıyor."}
  sara:  {de: "Ärztin. Sie kommt aus Wien und liest gern Bücher.", en: "A doctor. She comes from Vienna and likes reading books.", tr: "Doktor. Viyanalı ve kitap okumayı seviyor."}
  ben:   {de: "Student. Er kommt aus Berlin und reist gern.", en: "A student. He comes from Berlin and likes travelling.", tr: "Üniversite öğrencisi. Berlinli ve seyahat etmeyi seviyor."}
  lukas: {de: "24 Jahre alt, Koch in Zürich. Er spielt gern Fußball.", en: "24 years old, a cook in Zurich. He likes playing football.", tr: "24 yaşında, Zürih’te aşçı. Futbol oynamayı seviyor."}
  weber: {de: "Die Lehrerin im Deutschkurs.", en: "The teacher of the German course.", tr: "Almanca kursunun öğretmeni."}

# What --sample puts into the free sample (folios; front matter and sales page are always included)
sample:
  pages: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  appendix: [L 1, W 1]
