# ─────────────────────────────────────────────────────────────────────────────
# 300 Pages of German · series configuration
# Everything that is the same for every level and every language lives here.
# Colours are OKLCH triplets [lightness, chroma, hue] and are converted (and
# gamut-mapped) to sRGB at build time, so the whole palette stays one family.
# ─────────────────────────────────────────────────────────────────────────────
series:
  id: 300-pages
  publisher: Deutsch Fokus
  author: Deutsch Fokus
  year: 2026
  version: "1.0-demo"
  # Everything points to the YouTube channel until a shop and an audio host exist.
  youtube_url: https://www.youtube.com/@Deutsch_Fokus
  shop_url: ""               # where the full book is sold; empty = the last page invites readers to the channel
  audio_url: ""              # e.g. "https://…/{level}/{track}"; empty = QR codes and track links open the channel
  contact: ""                # e-mail address; empty = the imprint points to the channel

languages: [en, tr]        # explanation languages; every content string needs all of them
levels: [a1, a2, b1, b2, c1, c2]

# Fixed anatomy of every book: 12 × 24 + 3 × 4 = 300 learning pages.
structure:
  chapters: 12
  stations_after: [4, 8, 12]
  station_pages: 4
  sections:                      # order and page budget inside a chapter
    - {id: auftakt,       de: Auftakt,       pages: 1}
    - {id: wortschatz,    de: Wortschatz,    pages: 2}
    - {id: hauptteil,     de: Hauptteil,     pages: 6}
    - {id: vertiefung,    de: Vertiefung,    pages: 10}
    - {id: uebersicht,    de: Übersicht,     pages: 2}
    - {id: abschlusstest, de: Abschlusstest, pages: 2}
    - {id: rueckblick,    de: Rückblick,     pages: 1}

# Page geometry in millimetres (A4). Inner/outer margins are mirrored.
page:
  width: 210
  height: 297
  inner: 18
  outer: 14
  top: 21
  header_top: 9.6
  footer_top: 268.6          # "Wörter auf dieser Seite" strip
  folio_top: 277.6
  main: 132.25               # main column (9 of 12 grid columns)
  gap: 5
  margin_col: 40.75          # outer note column (3 of 12 grid columns)
  label_col: 15              # task address + skill icons
  bleed: 3                   # --print
  slug: 7                    # --print: room for crop marks around the bleed
  tab: {width: 8, height: 17, first: 21, step: 19.6}

# Static instances cut from the variable fonts by tools/make_fonts.py.
# Weights must be multiples of 100 (WeasyPrint accepts nothing else). For Fraunces a weight is a
# typographic role with its own real weight, optical size and softness – see tools/make_fonts.py.
fonts:
  dir: assets/fonts/static
  faces:
    - {family: DF Fraunces, weight: 900, file: DFFraunces-Hero.ttf}          # the 300, chapter numerals, level
    - {family: DF Fraunces, weight: 800, file: DFFraunces-Num.ttf}           # folios, tabs, track numbers
    - {family: DF Fraunces, weight: 700, file: DFFraunces-Title.ttf}         # chapter and page titles
    - {family: DF Fraunces, weight: 600, file: DFFraunces-Sub.ttf}           # box titles, small headings
    - {family: DF Fraunces, weight: 500, file: DFFraunces-Text.ttf}          # goal statement
    - {family: DF Fraunces, weight: 500, style: italic, file: DFFraunces-TextItalic.ttf}
    - {family: DF Fraunces, weight: 400, file: DFFraunces-Display.ttf}       # cover title line
    - {family: DF Sans, weight: 400, file: DFSans-Regular.ttf}
    - {family: DF Sans, weight: 400, style: italic, file: DFSans-Italic.ttf}
    - {family: DF Sans, weight: 600, file: DFSans-SemiBold.ttf}
    - {family: DF Sans, weight: 700, file: DFSans-Bold.ttf}
    - {family: DF Sans, weight: 700, style: italic, file: DFSans-BoldItalic.ttf}
    - {family: DF Sans, weight: 800, file: DFSans-ExtraBold.ttf}
    - {family: DF Serif, weight: 400, file: DFSerif-Regular.ttf}
    - {family: DF Serif, weight: 400, style: italic, file: DFSerif-Italic.ttf}
    - {family: DF Serif, weight: 700, file: DFSerif-Bold.ttf}
    - {family: DF Hand, weight: 500, file: DFHand-Medium.ttf}
    - {family: DF Hand, weight: 700, file: DFHand-Bold.ttf}
  credits:
    - "Fraunces © The Fraunces Project Authors"
    - "Source Sans 3 and Source Serif 4 © Adobe"
    - "Caveat © The Caveat Project Authors"
  licence: SIL Open Font License 1.1

colors:
  ink:    "#1B1E2F"
  mute:   "#5A5F73"
  faint:  "#8D92A3"
  line:   "#D8DAE2"
  rule:   "#B8BCCB"
  grey:   "#F4F3EF"
  paper:  "#FFFFFF"
  cream:  "#FBF4E6"
  navy:   "#161B36"
  pen:    "#2A3F9D"          # handwriting ink (Königsblau)
  bad:    "#C4372C"          # strike-through in "typical mistake"
  # Article colours — fixed across the whole series. Never used for anything else.
  articles:
    der: [0.50, 0.19, 258]
    die: [0.53, 0.21, 356]
    das: [0.50, 0.14, 150]
    pl:  [0.31, 0.11, 270]
  article_tint: {l: 0.955, c: 0.03}      # soft chip behind an article word
  # Margin-note colours (text-safe tones; used for label + top rule only)
  notes:
    tipp:        [0.47, 0.11, 75]
    wort:        [0.45, 0.15, 305]
    landeskunde: [0.45, 0.09, 205]
    sogehts:     [0.42, 0.04, 260]
  # How the 12 chapter tints of a level are generated from the level hue.
  chapter:
    spread: 25               # ± degrees around the level hue; chapter 1 = hue + spread
    mid:    {l: 0.70, l_swing: 0.08, l_peak_hue: 95, c: 0.17}   # big shapes, tabs, numerals
    soft:   {l: 0.935, c: 0.05}
    wash:   {l: 0.972, c: 0.022}
    hl:     {l: 0.88, c: 0.10}          # highlighter behind endings / verb positions
    strong: {l: 0.55, c: 0.15}          # safe under white text
    deep:   {l: 0.40, c: 0.10}          # small coloured text on white

# Design direction (set after the concept round)
design:
  cover: monument            # the built cover; concepts B (spectrum) and C (fokus) exist only as PNGs in concepts/
  cover_figure: elif         # cast member in front of the 300 (assets/cast/cover-<key>.png); leave empty for the type-only cover
  opener: buehne             # buehne | register

# Recurring cast. `avatar` drives the generated placeholder portraits.
cast:
  elif:    {name: Elif,         full: Elif Demir,     avatar: {skin: "#F2C9A6", hair: "#12827B", style: scarf, top: "#12827B", bg: "#D8F0EC"}}
  rahul:   {name: Rahul,        full: Rahul,          avatar: {skin: "#C98E5E", hair: "#1E1512", style: curly, top: "#B42A63", bg: "#F8DDE8", glasses: true}}
  david:   {name: Herr Berger,  full: David Berger,   avatar: {skin: "#D9A074", hair: "#1E1512", style: short, top: "#F07F13", bg: "#FDE7CF", moustache: "#1E1512"}}
  amina:   {name: Frau Diallo,  full: Amina Diallo,   avatar: {skin: "#7B4B2E", hair: "#1E1512", style: curly, top: "#EFE3CC", bg: "#F6EEDD", band: "#E4572E"}}
  maria:   {name: Maria,        full: Maria Lorenz,   avatar: {skin: "#E9B78E", hair: "#5A3A2A", style: bun,   top: "#C4372C", bg: "#F9DDD9"}}
  yusuf:   {name: Yusuf,        full: Yusuf,          avatar: {skin: "#D9A074", hair: "#1E1512", style: short, top: "#2F4A7D", bg: "#DEE6F7", beard: "#1E1512", cap: "#2F5FB3"}}
  anna:    {name: Anna,         full: Anna,           avatar: {skin: "#F0C29A", hair: "#5A3323", style: long,  top: "#F1E6D2", bg: "#F6EEDD"}}
  alvarez: {name: Herr Alvarez, full: Herr Alvarez,   avatar: {skin: "#D9A074", hair: "#7A7F8A", style: short, top: "#56607A", bg: "#E3E6EE", beard: "#A9ADB6"}}
  reporterin: {name: Reporterin, full: Reporterin,   avatar: {skin: "#B9825A", hair: "#2B1D17", style: bun,   top: "#B5446E", bg: "#F6DDE7"}}
  ansage:  {name: Ansage,       full: Ansage,         avatar: {style: voice, bg: "#E7E9EE"}}

# Short portraits for the "Die Personen" page (characters without a bio are not listed there).
bios:
  elif:    {de: "27, Pflegekraft. Neu in Hannover – und neugierig auf alles.", en: "27, nurse. New in Hanover – and curious about everything.", tr: "27 yaşında, hemşire. Hannover’de yeni ve her şeyi merak ediyor."}
  rahul:   {de: "24, Informatikstudent und Elifs bester Freund. Hilft bei jedem Umzug.", en: "24, computer science student and Elif’s best friend. Helps with every move.", tr: "24 yaşında, bilgisayar öğrencisi ve Elif’in en yakın dostu. Her taşınmada yardıma koşar."}
  david:   {de: "38, Hausmeister im Erdgeschoss. Streng mit der Hausordnung, aber immer hilfsbereit.", en: "38, the caretaker on the ground floor. Strict about the house rules, but always ready to help.", tr: "38 yaşında, zemin kattaki bina görevlisi. Kurallar konusunda titiz ama her zaman yardımsever."}
  amina:   {de: "29, leitet die Hausverwaltung. Sie löst jedes Problem – meistens noch am selben Tag.", en: "29, runs the property management. She solves every problem – usually the same day.", tr: "29 yaşında, bina yönetimini yürütüyor. Her sorunu çözer; çoğu zaman aynı gün."}
  maria:   {de: "48, Nachbarin im zweiten Stock. Feiert gern – und lädt alle ein.", en: "48, neighbour on the second floor. Loves a party – and invites everyone.", tr: "48 yaşında, ikinci kattaki komşu. Kutlamayı sever, herkesi de davet eder."}
  yusuf:   {de: "33, Handwerker. Repariert im Repair-Café alles, was kaputt ist.", en: "33, craftsman. Fixes everything that’s broken at the repair café.", tr: "33 yaşında, usta. Repair-Café’de bozuk olan her şeyi tamir eder."}
  anna:    {de: "25, Studentin und Elifs Freundin aus dem Deutschkurs. Schreibt die besten Nachrichten.", en: "25, student and Elif’s friend from the German course. Writes the best messages.", tr: "25 yaşında, öğrenci ve Elif’in Almanca kursundan arkadaşı. En güzel mesajları o yazar."}
  alvarez: {de: "52, Vermieter. Freundlich, pünktlich und ein bisschen sparsam.", en: "52, landlord. Friendly, punctual and a little thrifty.", tr: "52 yaşında, ev sahibi. Güler yüzlü, dakik ve biraz tutumlu."}
