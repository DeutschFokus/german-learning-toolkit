goals:
  "Introduce yourself, greet other people and ask simple questions about name and home town.":
    de: "Du stellst dich vor, begrüßt andere und stellst einfache Fragen zu Name und Wohnort."
    tr: "Kendini tanıtırsın, başkalarını selamlarsın ve ad ile yaşanılan yer hakkında basit sorular sorarsın."

cando:             # ref = number of the block where the learner can look again
  "introduce myself and others": {de: "Ich kann mich und andere vorstellen.", en: "I can introduce myself and others.", tr: "Kendimi ve başkalarını tanıtabilirim.", ref: 2}
  "ask for name and home town": {de: "Ich kann nach Name und Wohnort fragen.", en: "I can ask for name and home town.", tr: "Ad ve yaşanılan yeri sorabilirim.", ref: 14}
  "say where I come from": {de: "Ich kann sagen, woher ich komme.", en: "I can say where I come from.", tr: "Nereli olduğumu söyleyebilirim.", ref: 8}
  "greet people politely": {de: "Ich kann Personen höflich begrüßen.", en: "I can greet people politely.", tr: "İnsanları kibarca selamlayabilirim.", ref: 9}
  "count to five": {de: "Ich kann bis fünf zählen.", en: "I can count to five.", tr: "Beşe kadar sayabilirim.", ref: 1}

phrases:
  "Hallo! Ich heiße …": {en: "Hello! My name is …", tr: "Merhaba! Benim adım …"}
  "Wie heißt du? / Wie heißen Sie?": {en: "What is your name? (informal / formal)", tr: "Adın ne? / Adınız ne?"}
  "Woher kommst du? – Ich komme aus …": {en: "Where are you from? – I am from …", tr: "Nerelisin? – …-liyim."}
  "Wo wohnst du? – Ich wohne in …": {en: "Where do you live? – I live in …", tr: "Nerede oturuyorsun? – …-de oturuyorum."}
  "Freut mich!": {en: "Nice to meet you!", tr: "Memnun oldum!"}

