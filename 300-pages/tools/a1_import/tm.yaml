texts:             # explanations and tips (old English → marked-up English + Turkish)
  "The verb sein is irregular. In the present tense: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.":
    en: "The verb {de:sein} is irregular. In the present tense: {de:ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind}."
    tr: "{de:sein} fiili düzensizdir. Şimdiki zamanda: {de:ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind}."
  "Learn the forms of sein by heart. You need them every day.":
    en: "Learn the forms of {de:sein} by heart. You need them every day."
    tr: "{de:sein} fiilinin biçimlerini ezberle. Onlara her gün ihtiyacın olacak."
  "The verbs heißen and wohnen are almost regular. The ending -st goes with du, the ending -t with er/sie/es. Present tense: ich heiße, du heißt, er/sie/es heißt; ich wohne, du wohnst, er/sie/es wohnt.":
    en: "The verbs {de:heißen} and {de:wohnen} are almost regular. The ending {de:-st} goes with {de:du}, the ending {de:-t} with {de:er/sie/es}. Present tense: {de:ich heiße, du heißt, er/sie/es heißt; ich wohne, du wohnst, er/sie/es wohnt}."
    tr: "{de:heißen} ve {de:wohnen} fiilleri neredeyse düzenlidir. {de:du} ile {de:-st}, {de:er/sie/es} ile {de:-t} eki kullanılır. Şimdiki zaman: {de:ich heiße, du heißt, er/sie/es heißt; ich wohne, du wohnst, er/sie/es wohnt}."
  "The ending shows the person: -e for ich, -st for du, -t for er, sie and es.":
    en: "The ending shows the person: {de:-e} for {de:ich}, {de:-st} for {de:du}, {de:-t} for {de:er}, {de:sie} and {de:es}."
    tr: "Ek, kişiyi gösterir: {de:ich} için {de:-e}, {de:du} için {de:-st}, {de:er}, {de:sie} ve {de:es} için {de:-t}."
  "The verb kommen: ich komme, du kommst, er/sie/es kommt. To say where you are from, use aus. With die Schweiz: aus der Schweiz. Countries without an article: aus Deutschland.":
    en: "The verb {de:kommen}: {de:ich komme, du kommst, er/sie/es kommt}. To say where you are from, use {de:aus}. With {de:die Schweiz}: {de:aus der Schweiz}. Countries without an article: {de:aus Deutschland}."
    tr: "{de:kommen} fiili: {de:ich komme, du kommst, er/sie/es kommt}. Nereli olduğunu söylemek için {de:aus} kullanılır. {de:die Schweiz} ile: {de:aus der Schweiz}. Artikelsiz ülkeler: {de:aus Deutschland}."
  "Say the examples out loud. That helps you remember the forms.":
    tr: "Örnekleri sesli söyle. Bu, biçimleri aklında tutmana yardım eder."
  "This list helps you: tick what you can already do with confidence. Repeat what does not work yet.":
    en: "Tick what you can already do with confidence. Not sure yet? The page number shows where to look again."
    tr: "Güvenle yapabildiklerini işaretle. Henüz emin değil misin? Sayfa numarası nereye tekrar bakacağını gösterir."

