# Wording for the A1 book: what the old PDF says (the keys) → what the new book prints.
#
# The old book gives instructions, block titles, tips and explanations in English only. The new
# book prints the German instruction first and then a line in the explanation language of the
# edition (English or Turkish). This file is the translation memory for all of that; convert.py
# reports every string it cannot find here.
#
# In en/tr texts German words are written as {de:Wort}; in German rubrics as *Wort*.

prefix:            # added in front of a rubric when the task starts with something to read or look at
  dialogue: {de: "Lies den Dialog.", en: "Read the dialogue.", tr: "Diyaloğu oku."}
  text:     {de: "Lies den Text.", en: "Read the text.", tr: "Metni oku."}
  email:    {de: "Lies die E-Mail.", en: "Read the e-mail.", tr: "E-postayı oku."}
  profiles: {de: "Lies die Steckbriefe.", en: "Read the profiles.", tr: "Tanıtım kartlarını oku."}
  picture:  {de: "Sieh das Bild an.", en: "Look at the picture.", tr: "Resme bak."}

rubrics:
  "Which article fits? Tick the correct box.":
    {de: "Welcher Artikel passt? Kreuze an.", tr: "Hangi artikel uygun? İşaretle.", en: "Which article fits? Tick the correct box.", skills: [wortschatz]}
  "Match. Write the letter in the gap.":
    {de: "Was passt zusammen? Schreib den Buchstaben in das Kästchen.", en: "Match. Write the letter in the box.", tr: "Eşleştir. Harfi kutuya yaz.", skills: [wortschatz]}
  "True or false? Tick the correct box.":
    {de: "Richtig oder falsch? Kreuze an.", tr: "Doğru mu, yanlış mı? İşaretle.", skills: [lesen]}
  "Answer the questions. Write full sentences.":
    {de: "Beantworte die Fragen in ganzen Sätzen.", en: "Answer the questions in full sentences.", tr: "Soruları tam cümlelerle cevapla.", skills: [lesen, schreiben]}
  "Answer the questions in full sentences.":
    {de: "Beantworte die Fragen in ganzen Sätzen.", tr: "Soruları tam cümlelerle cevapla.", skills: [lesen, schreiben]}
  "What can you see? Complete the sentences with words from the box.":
    {de: "Was siehst du auf dem Bild? Ergänze die Sätze mit den Wörtern aus dem Kasten.", en: "What can you see in the picture? Complete the sentences with words from the box.",
     tr: "Resimde ne görüyorsun? Cümleleri kutudaki kelimelerle tamamla.", skills: [wortschatz], noprefix: true}
  "Describe the picture. Answer the questions.":
    {de: "Beschreib das Bild. Beantworte die Fragen.", tr: "Resmi anlat. Soruları cevapla.", skills: [schreiben], noprefix: true}
  "Write an answer for Frau Berger. Use the formal Sie.":
    {de: "Die Fragen sind formell (*Sie*). Antworte für Frau Berger.", en: "The questions use the formal {de:Sie}. Write the answers for Frau Berger.",
     tr: "Sorular resmî ({de:Sie}). Frau Berger’in yerine cevap yaz.", skills: [schreiben]}
  "Write questions with Wo wohnst du? and Wo wohnt er/sie?":
    {de: "Wo wohnt er? Wo wohnt sie? Schreib Fragen und Antworten.", en: "Write questions and answers with {de:Wo wohnt …?}",
     tr: "{de:Wo wohnt …?} ile sorular ve cevaplar yaz.", skills: [grammatik, schreiben]}
  "Complete the question word: Wie, Wo or Was. The answer helps you.":
    {de: "Ergänze das Fragewort: *Wie*, *Wo* oder *Was*. Die Antwort hilft dir.", en: "Complete the question word: {de:Wie}, {de:Wo} or {de:Was}. The answer helps you.",
     tr: "Soru kelimesini tamamla: {de:Wie}, {de:Wo} veya {de:Was}. Cevap sana yardım eder.", skills: [grammatik]}
  "Complete the question word.":
    {de: "Ergänze das Fragewort.", tr: "Soru kelimesini tamamla.", skills: [grammatik]}
  "Write 5 sentences about yourself: name, home town, job.":
    {de: "Schreib 5 Sätze über dich: Name, Wohnort, Beruf.", tr: "Kendin hakkında 5 cümle yaz: adın, yaşadığın şehir, mesleğin.", skills: [schreiben]}
  "Ask your partner. Write down the answers.":
    {de: "Frag deine Partnerin oder deinen Partner. Schreib die Antworten auf.", tr: "Partnerine sor. Cevapları yaz.", skills: [partner, schreiben]}
  "Make sentences. Mind the word order: the verb is in position 2.":
    {de: "Bilde Sätze. Achte auf die Wortstellung: Das Verb steht auf Position 2.", tr: "Cümle kur. Kelime sırasına dikkat et: Fiil 2. sırada durur.", skills: [grammatik]}
  "Make sentences from the words.":
    {de: "Bilde Sätze aus den Wörtern.", tr: "Kelimelerden cümle kur.", skills: [grammatik]}
  "Complete the sentences with words from the box. The first letter helps you.":
    {de: "Ergänze die Sätze mit den Wörtern aus dem Kasten. Der erste Buchstabe hilft dir.", tr: "Cümleleri kutudaki kelimelerle tamamla. İlk harf sana yardım eder.", skills: [wortschatz]}
  "Write 5 sentences about a friend: name, age, home town, job.":
    {de: "Schreib 5 Sätze über einen Freund oder eine Freundin: Name, Alter, Wohnort, Beruf.", tr: "Bir arkadaşın hakkında 5 cümle yaz: adı, yaşı, yaşadığı şehir, mesleği.", skills: [schreiben]}
  "Write 4 sentences: you meet a new person in your German course. Introduce yourself.":
    {de: "Du triffst eine neue Person im Deutschkurs. Stell dich vor. Schreib 4 Sätze.", en: "You meet a new person in your German course. Introduce yourself. Write 4 sentences.",
     tr: "Almanca kursunda yeni biriyle tanışıyorsun. Kendini tanıt. 4 cümle yaz.", skills: [schreiben]}
  "How do you say it in German? Write nouns with the article.":
    {de: "Wie heißt das auf Deutsch? Schreib Nomen mit Artikel.", tr: "Almancası ne? İsimleri artikeliyle yaz.", skills: [wortschatz]}

rubric_patterns:
  - match: "Write the plural\\. Example: .+"
    de: "Schreib den Plural."
    en: "Write the plural."
    tr: "Çoğul hâlini yaz."
    skills: [wortschatz]
  - match: "Complete the sentences with the correct form of (\\w+)\\."
    de: "Ergänze die richtige Form von *{1}*."
    en: "Complete the sentences with the correct form of {de:{1}}."
    tr: "Cümleleri {de:{1}} fiilinin doğru biçimiyle tamamla."
    skills: [grammatik]
  - match: "Complete the sentences with (\\w+)\\."
    de: "Ergänze die richtige Form von *{1}*."
    en: "Complete the sentences with the correct form of {de:{1}}."
    tr: "Cümleleri {de:{1}} fiilinin doğru biçimiyle tamamla."
    skills: [grammatik]
  - match: "Write (\\d+) sentences about the topic “(.+?)”\\. Use words from this chapter\\."
    de: "Schreib {1} Sätze zum Thema „{2}“. Benutze Wörter aus diesem Kapitel."
    en: "Write {1} sentences about the topic “{2}”. Use words from this chapter."
    tr: "“{2}” konusunda {1} cümle yaz. Bu bölümün kelimelerini kullan."
    skills: [schreiben]

