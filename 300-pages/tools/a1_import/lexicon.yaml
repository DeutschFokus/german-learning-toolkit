# Vocabulary supplement for the A1 book, keyed by the headword as the old PDF prints it.
#
# The old book gives every word with an English gloss; cards also give the plural. This file adds
# what is missing: the Turkish translation (tr), the plural of nouns that only occur in page
# footers (plural, in the series notation), corrections (de, pos, en) and a better card group.
# convert.py lists every word it cannot complete from here.

# ── Kapitel 1 · cards ────────────────────────────────────────────────────────
"der Name": {tr: "isim, ad"}
"die Stadt": {tr: "şehir"}
"das Land": {tr: "ülke"}
"der Beruf": {tr: "meslek"}
"heißen": {tr: "adı … olmak (ich heiße)"}
"wohnen": {tr: "oturmak, yaşamak (ich wohne)"}
"die Schweiz": {tr: "İsviçre", plural: Sg.}
"das Österreich": {de: Österreich, article: null, pos: name, tr: "Avusturya"}      # countries without article
"Österreich": {pos: name, tr: "Avusturya"}
