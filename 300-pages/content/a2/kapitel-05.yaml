type: chapter
level: a2
number: 5
title: Wohnen
subtitle:
  en: "Home sweet home – flats, neighbours, house rules"
  tr: "Evim evim, güzel evim – daireler, komşular, apartman kuralları"
goal:
  de: "Du kommst in deiner Wohnung und mit deinen Nachbarn gut zurecht – von der Anzeige bis zur Reparatur."
  en: "Handle life in your flat and with your neighbours – from listing to repair."
  tr: "Evinde ve komşularınla her işini halledersin – ilandan tamire kadar."
can_do:
  - {de: "Ich kann meine Wohnung beschreiben.", en: "I can describe my flat.", tr: "Evimi tarif edebilirim.", ref: "5.2"}
  - {de: "Ich kann eine Wohnungsanzeige verstehen.", en: "I can understand a flat listing.", tr: "Bir kiralık daire ilanını anlayabilirim.", ref: "5.3"}
  - {de: "Ich kann sagen, wo etwas steht und wohin es kommt.", en: "I can say where things are and where they go.", tr: "Bir şeyin nerede durduğunu ve nereye konacağını söyleyebilirim.", ref: "5.4"}
  - {de: "Ich kann der Hausverwaltung ein Problem melden.", en: "I can report a problem to the property management.", tr: "Bina yönetimine bir sorunu bildirebilirim.", ref: "5.5"}
  - {de: "Ich kann Nachbarn höflich um Hilfe bitten.", en: "I can politely ask neighbours for help.", tr: "Komşulardan kibarca yardım isteyebilirim.", ref: "5.7"}
  - {de: "Ich kann den Müll richtig trennen.", en: "I can sort my rubbish correctly.", tr: "Çöpü doğru şekilde ayırabilirim.", ref: "5.6"}
grammar: [Wechselpräpositionen, wenn-Sätze, Passiv Präsens]
image:
  id: k5-auftakt
  format: banner
  src: assets/images/a2/k5-auftakt.jpg
  description: "Elif steht mit einem Umzugskarton in ihrem neuen, noch leeren Wohnzimmer. Großes Fenster, Abendlicht, Blick auf Dächer. In der Tür steht Herr Berger mit einer Pflanze."
  alt:
    en: "Elif stands in her new, still empty living room holding a moving box; Mr Berger is at the door with a plant."
    tr: "Elif, elinde bir taşınma kolisiyle yeni ve henüz boş oturma odasında duruyor; Bay Berger kapıda, elinde bir bitkiyle bekliyor."

