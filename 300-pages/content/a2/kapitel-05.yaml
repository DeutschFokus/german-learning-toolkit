teile:
  # ═══ 1 · AUFTAKT ═══════════════════════════════════════════════ page 101 ═══
  - nr: 1
    section: auftakt
    title: Auftakt
    subtitle: {en: "Warm-up", tr: "Isınma"}
    blocks:
      - type: task
        id: a
        skills: [sprechen, partner]
        rubric:
          de: "Sieh das Bild an. Wie findest du Elifs Wohnung? Sprecht zu zweit."
          en: "Look at the picture. What do you think of Elif’s flat? Talk in pairs."
          tr: "Resme bak. Elif’in evini nasıl buluyorsun? İkişerli konuşun."
        body:
          - type: bubbles
            items: ["Ich finde die Wohnung …", "Das Wohnzimmer ist hell / klein / gemütlich.", "Mir gefällt …"]
        answer:
          open: true
          model: "Ich finde die Wohnung schön. Das Wohnzimmer ist hell, aber noch leer. Mir gefällt das große Fenster."
        words: [hell, gemuetlich, nachbar]

  # ═══ 2 · WORTSCHATZ ════════════════════════════════════════ pages 102–103 ═══
  - nr: 2
    section: wortschatz
    title: Zimmer, Möbel, Haus
    subtitle: {en: "Rooms, furniture and the building", tr: "Odalar, mobilyalar ve bina"}
    blocks:
      - type: task
        id: a
        skills: [lesen]
        rubric:
          de: "Sieh das Bild an und lies die Wörter. Welche kennst du schon? Kreuze an."
          en: "Look at the picture and read the words. Which ones do you already know? Tick them."
          tr: "Resme bak ve kelimeleri oku. Hangilerini zaten biliyorsun? İşaretle."
        body:
          - type: picture_dictionary
            image:
              id: k5-wohnung
              src: assets/images/a2/k5-wohnung.jpg
              format: tall
              description: "Elifs Wohnung von oben, wie ein bunter Grundriss mit Möbeln: Flur, Wohnzimmer mit Sofa, Regal und Teppich, Schlafzimmer, Küche mit Kühlschrank, Bad mit Waschmaschine und Spiegel, kleiner Balkon. Zwölf Zahlen markieren die Wörter."
              alt:
                en: "Bird’s-eye view of Elif’s flat with twelve numbered rooms and pieces of furniture."
                tr: "Elif’in evinin kuş bakışı görünümü; on iki oda ve eşya numaralandırılmış."
              markers:
                - {n: 1, x: 50.8, y: 78.7}
                - {n: 2, x: 22.8, y: 21.3}
                - {n: 3, x: 76.7, y: 20.1}
                - {n: 4, x: 17.3, y: 65.8}
                - {n: 5, x: 67.3, y: 66.9}
                - {n: 6, x: 50.1, y: 7.9}
                - {n: 7, x: 29.0, y: 35.7}
                - {n: 8, x: 48.3, y: 42.8}
                - {n: 9, x: 28.8, y: 51.6}
                - {n: 10, x: 31.9, y: 75.3}
                - {n: 11, x: 69.1, y: 87.8}
                - {n: 12, x: 77.7, y: 72.0}
            items: [flur, wohnzimmer, schlafzimmer, kueche, bad, balkon, sofa, regal, teppich, kuehlschrank, waschmaschine, spiegel]
        answer: {open: true}
        words: [flur, wohnzimmer, schlafzimmer, kueche, bad, balkon, sofa, regal, teppich, kuehlschrank, waschmaschine, spiegel]

      - type: task
        id: b
        skills: [schreiben]
        rubric:
          de: "Der, die oder das? Ergänze die Artikel."
          en: "Der, die or das? Fill in the articles."
          tr: "Der, die mi, das mı? Artikelleri tamamla."
        points: 8
        body:
          - type: gap_text
            compact: true
            items: ["[[die]] Küche", "[[das]] Bad", "[[der]] Flur", "[[das]] Sofa", "[[die]] Waschmaschine", "[[der]] Teppich", "[[das]] Regal", "[[der]] Balkon"]
        notes:
          - kind: tipp
            text:
              en: "Learn every noun together with its article – and its colour: {de:der} blue, {de:die} red, {de:das} green."
              tr: "Her ismi artikeliyle ve rengiyle birlikte öğren: {de:der} mavi, {de:die} kırmızı, {de:das} yeşil."

      - type: task
        id: c
        skills: [hoeren]
        rubric:
          de: "Elif zeigt Rahul ihre Wohnung. Hör zu und kreuze an: A, B oder C?"
          en: "Elif shows Rahul her flat. Listen and tick A, B or C."
          tr: "Elif, Rahul’a evini gösteriyor. Dinle ve işaretle: A, B ya da C?"
        points: 4
        audio:
          track: "5.01"
          title: Elifs neue Wohnung
          duration: "0:48"
          transcript:
            turns:
              - {speaker: elif, text: "Komm rein, Rahul! Das ist meine neue Wohnung."}
              - {speaker: rahul, text: "Wow, schön hell! Wie viele Zimmer hast du?"}
              - {speaker: elif, text: "Zwei Zimmer, eine Küche und ein Bad. Hier links ist das Wohnzimmer."}
              - {speaker: rahul, text: "Das Wohnzimmer ist aber groß! Und wo schläfst du?"}
              - {speaker: elif, text: "Das Schlafzimmer ist rechts, neben dem Bad. Es ist klein, aber ruhig."}
              - {speaker: rahul, text: "Hast du auch einen Keller?"}
              - {speaker: elif, text: "Nein, leider nicht. Aber ich habe einen kleinen Balkon."}
              - {speaker: rahul, text: "Und die Küche?"}
              - {speaker: elif, text: "Die Küche ist hinten. Sie ist ziemlich alt, aber der Herd funktioniert."}
        body:
          - type: multiple_choice
            items:
              - {q: "Elifs Wohnung hat …", options: ["ein Zimmer.", "zwei Zimmer.", "drei Zimmer."], answer: B}
              - {q: "Das Schlafzimmer ist …", options: ["klein und ruhig.", "groß und hell.", "alt und dunkel."], answer: A}
              - {q: "Elif hat …", options: ["einen Keller.", "einen Garten.", "einen Balkon."], answer: C}
              - {q: "Die Küche ist …", options: ["neu.", "ziemlich alt.", "sehr klein."], answer: B}
        notes:
          - kind: wort
            words: [ruhig, keller, herd]
        words: [keller, herd, ruhig, dunkel]

      - type: task
        id: d
        skills: [schreiben]
        rubric:
          de: "Wie ist deine Wohnung? Schreib drei Sätze."
          en: "What is your flat like? Write three sentences."
          tr: "Senin evin nasıl? Üç cümle yaz."
        body:
          - type: word_bank
            items: [hell, dunkel, ruhig, laut, gemütlich, modern, klein, groß, günstig, teuer]
          - type: write_lines
            lines: 3
            model: "Meine Wohnung hat zwei Zimmer. Das Wohnzimmer ist hell und gemütlich."
        answer:
          open: true
          model: "Meine Wohnung hat zwei Zimmer. Das Wohnzimmer ist hell und gemütlich. Leider habe ich keinen Balkon."
        notes:
          - kind: sogehts
            text:
              en: "Three useful ways to start: {de:Meine Wohnung hat …} · {de:In meiner Wohnung gibt es …} · {de:Ich habe (k)einen / (k)eine / (k)ein …}"
              tr: "Cümleye başlamak için üç kalıp: {de:Meine Wohnung hat …} · {de:In meiner Wohnung gibt es …} · {de:Ich habe (k)einen / (k)eine / (k)ein …}"
        words: [laut, guenstig, zimmer]

      - type: task
        id: e
        skills: [sprechen, partner]
        rubric:
          de: "Fragt und antwortet."
          en: "Ask and answer."
          tr: "Sorun ve cevaplayın."
        body:
          - type: bubbles
