              - {given: "Wenn ich Zeit habe, ich besuche dich.", answer: "Wenn ich Zeit habe, ==besuche ich== dich."}
              - {given: "Der Müll wird morgen abholen.", answer: "Der Müll wird morgen ==abgeholt==."}
