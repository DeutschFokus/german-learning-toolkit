        notes:
          - kind: sogehts
            text:
              en: "The object of the active sentence becomes the subject of the passive sentence: {de:den Müll} → {de:Der Müll wird …}"
              tr: "Etken cümlenin nesnesi, edilgen cümlenin öznesi olur: {de:den Müll} → {de:Der Müll wird …}"

