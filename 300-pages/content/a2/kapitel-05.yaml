# ── Übersicht ────────────────────────────────────────────────── pages 120–121 ──
uebersicht:
  grammar:
    - type: grammar_box
      title: Wechselpräpositionen
      first_col_head: true
      head: ["", "Wohin? → Akkusativ", "Wo? ● Dativ"]
      rows:
        - ["{der Tisch}", "Ich lege das Buch auf ==den== Tisch.", "Das Buch liegt auf ==dem== Tisch."]
        - ["{das Sofa}", "Ich stelle die Lampe neben ==das== Sofa.", "Die Lampe steht neben ==dem== Sofa."]
        - ["{die Wand}", "Ich hänge das Bild an ==die== Wand.", "Das Bild hängt an ==der== Wand."]
        - ["{p:die Fenster}", "Ich stelle das Regal zwischen ==die== Fenster.", "Das Regal steht zwischen ==den== Fenster==n==."]
      lines:
        - "**stellen** → stehen · **legen** → liegen · **hängen** → hängen"
      note: "in · an · auf · unter · über · vor · hinter · neben · zwischen     in + dem = **im** · an + dem = **am** · in + das = **ins** · an + das = **ans**"
      rule:
        en: "Movement to a place ({de:Wohin?}) → accusative. Position ({de:Wo?}) → dative."
        tr: "Bir yere doğru hareket ({de:Wohin?}) → Akkusativ. Bir yerde bulunma ({de:Wo?}) → Dativ."
    - type: grammar_box
      title: wenn-Sätze
      head: ["Satz 1", "Satz 2"]
      rows:
        - ["Wenn die Heizung kalt ==bleibt==,", "==rufe== ich die Hausverwaltung an."]
        - ["Ich ==rufe== die Hausverwaltung an,", "wenn die Heizung kalt ==bleibt==."]
      rule:
        en: "In the {de:wenn}-clause the verb goes to the end. If the {de:wenn}-clause comes first, the main clause starts with its verb. There is always a comma between the two."
        tr: "{de:wenn} cümlesinde fiil sonda durur. {de:wenn} cümlesi başta ise ana cümle fiille başlar. İki cümle arasına her zaman virgül konur."
    - type: grammar_box
      title: Passiv Präsens
      head: ["", "werden", "", "Partizip II"]
      rows:
        - ["Der Müll", "==wird==", "am Dienstag", "==abgeholt==."]
        - ["Die Tonnen", "==werden==", "jede Woche", "==geleert==."]
        - ["Hier", "==werden==", "Fahrräder", "==repariert==."]
      lines:
        - "abholen → ab==ge==hol==t== · leeren → ==ge==leer==t== · reparieren → reparier==t== · trinken → ==ge==trunk==en=="
      rule:
        en: "Passive = {de:werden} (position 2) + past participle (at the end). Use it when the action is more important than the person doing it."
        tr: "Edilgen çatı = {de:werden} (2. sırada) + Partizip II (sonda). Kimin yaptığı değil, yapılan iş önemliyse kullanılır."
  phrases:
    - type: phrases
      groups:
        - title: Die Wohnung beschreiben
          items:
            - {de: "Meine Wohnung hat zwei Zimmer.", en: "My flat has two rooms.", tr: "Evimin iki odası var."}
            - {de: "Die Wohnung ist 54 Quadratmeter groß.", en: "The flat is 54 square metres.", tr: "Daire 54 metrekare."}
            - {de: "Sie liegt im dritten Stock.", en: "It’s on the third floor.", tr: "Üçüncü katta."}
            - {de: "Das Wohnzimmer ist hell und gemütlich.", en: "The living room is bright and cosy.", tr: "Oturma odası aydınlık ve rahat."}
        - title: Nach einer Wohnung fragen
          items:
            - {de: "Ich rufe wegen der Wohnung an.", en: "I’m calling about the flat.", tr: "Daire için arıyorum."}
            - {de: "Ist die Wohnung noch frei?", en: "Is the flat still available?", tr: "Daire hâlâ boş mu?"}
            - {de: "Wie hoch sind die Nebenkosten?", en: "How much are the service charges?", tr: "Yan giderler ne kadar?"}
            - {de: "Kann ich die Wohnung besichtigen?", en: "Can I view the flat?", tr: "Daireyi görebilir miyim?"}
        - title: Ein Problem melden
          items:
            - {de: "Meine Heizung funktioniert nicht.", en: "My heating isn’t working.", tr: "Kaloriferim çalışmıyor."}
            - {de: "Das Fenster schließt nicht richtig.", en: "The window doesn’t close properly.", tr: "Pencere tam kapanmıyor."}
            - {de: "Können Sie bitte einen Handwerker schicken?", en: "Could you please send a repairman?", tr: "Lütfen bir usta gönderebilir misiniz?"}
            - {de: "Passt es Ihnen morgen um zehn Uhr?", en: "Does tomorrow at ten suit you?", tr: "Yarın saat on size uyar mı?"}
        - title: Höflich bitten
          items:
            - {de: "Entschuldigen Sie die Störung.", en: "Sorry to disturb you.", tr: "Rahatsız ettiğim için özür dilerim."}
            - {de: "Könnten Sie mir bitte helfen?", en: "Could you help me, please?", tr: "Bana yardım edebilir misiniz lütfen?"}
            - {de: "Hätten Sie vielleicht eine Leiter?", en: "Would you happen to have a ladder?", tr: "Acaba merdiveniniz var mı?"}
            - {de: "Darf ich Sie etwas fragen?", en: "May I ask you something?", tr: "Size bir şey sorabilir miyim?"}
        - title: Reagieren
          items:
            - {de: "Ja, gern. · Natürlich. · Kein Problem.", en: "Yes, gladly. · Of course. · No problem.", tr: "Evet, memnuniyetle. · Tabii. · Sorun değil."}
            - {de: "Tut mir leid, das geht leider nicht.", en: "Sorry, I’m afraid that’s not possible.", tr: "Üzgünüm, maalesef olmaz."}
            - {de: "Das tut mir leid.", en: "I’m sorry about that.", tr: "Buna üzüldüm."}
        - title: Am Telefon
          items:
            - {de: "Guten Tag, hier ist Elif Demir.", en: "Hello, this is Elif Demir.", tr: "İyi günler, ben Elif Demir."}
            - {de: "Was kann ich für Sie tun?", en: "What can I do for you?", tr: "Sizin için ne yapabilirim?"}
            - {de: "Vielen Dank, auf Wiederhören!", en: "Thank you, goodbye!", tr: "Çok teşekkürler, iyi günler!"}
        - title: Über Müll sprechen
          items:
            - {de: "Wohin kommt das Glas?", en: "Where does the glass go?", tr: "Cam nereye atılır?"}
            - {de: "Das gehört in die gelbe Tonne.", en: "That goes in the yellow bin.", tr: "Bu sarı bidona atılır."}
            - {de: "Wann wird der Müll abgeholt?", en: "When is the rubbish collected?", tr: "Çöp ne zaman toplanıyor?"}
        - title: Eine formelle E-Mail schreiben
          items:
            - {de: "Sehr geehrte Frau … · Sehr geehrter Herr …,", en: "Dear Ms … · Dear Mr …,", tr: "Sayın Bayan … · Sayın Bay …,"}
            - {de: "Sehr geehrte Damen und Herren,", en: "Dear Sir or Madam,", tr: "Sayın Yetkili,"}
            - {de: "Mit freundlichen Grüßen", en: "Kind regards", tr: "Saygılarımla"}

