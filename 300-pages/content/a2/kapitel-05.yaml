        answer:
          open: true
          model: "Mein Schreibtisch steht am Fenster. Ich stelle die Blumen immer auf den Balkon. Wenn es warm ist, frühstücke ich dort."

      - type: task
        id: d
        skills: [grammatik, schreiben]
        rubric:
          de: "Aktiv → Passiv. Schreib die Sätze neu."
          en: "Active → passive. Rewrite the sentences."
          tr: "Etken → edilgen. Cümleleri yeniden yaz."
        points: 6
        body:
