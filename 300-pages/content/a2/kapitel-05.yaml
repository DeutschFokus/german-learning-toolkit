  # ═══ 4 · HAUPTTEIL B ═══════════════════════════════════════ pages 106–107 ═══
  - nr: 4
    section: hauptteil
    title: Wohin kommt das Sofa?
    subtitle: {en: "Moving in: where things go and where they are", tr: "Taşınma: eşyalar nereye konur, nerede durur?"}
    blocks:
      - type: box
        body:
          - type: image
            id: k5-umzug
            src: assets/images/a2/k5-umzug.jpg
            format: strip
            description: "Elif und Rahul tragen ein Sofa ins Wohnzimmer. Überall Umzugskartons, eine Stehlampe, ein zusammengerollter Teppich und ein Bild lehnen an der Wand."
            alt:
              en: "Elif and Rahul carry a sofa into the living room, surrounded by moving boxes, a lamp, a rolled-up rug and a picture."
              tr: "Elif ve Rahul oturma odasına bir kanepe taşıyor; etrafta koliler, bir lamba, rulo yapılmış bir halı ve bir tablo var."

      - type: task
        id: a
        skills: [hoeren, lesen]
        rubric:
          de: "Elif zieht ein. Hör den Dialog und lies mit."
          en: "Elif is moving in. Listen to the dialogue and read along."
          tr: "Elif eve taşınıyor. Diyaloğu dinle ve metni takip et."
        audio:
          track: "5.03"
          title: Der Umzug
          duration: "0:55"
          transcript_from_body: true
        body:
          - type: dialogue
            turns:
              - {speaker: rahul, text: "Puh, das Sofa ist schwer! Wohin soll ich es stellen?"}
              - {speaker: elif, text: "Stell es bitte an die Wand, unter das Fenster."}
              - {speaker: rahul, text: "Okay. Und wohin kommt der Teppich?"}
              - {speaker: elif, text: "Leg ihn bitte vor das Sofa. Ja, super – jetzt liegt er genau in der Mitte."}
              - {speaker: rahul, text: "Und das Bild? Hängen wir es über das Sofa?"}
              - {speaker: elif, text: "Gute Idee! … So, fertig: Das Sofa steht an der Wand, der Teppich liegt vor dem Sofa und das Bild hängt über dem Sofa. Perfekt!"}
        answer:
          open: true
          note:
            en: "Listen and read along – nothing to check here."
            tr: "Dinle ve metni takip et – burada kontrol edilecek bir şey yok."
        notes:
          - kind: wort
            words: [schwer, mitte, wand]
        words: [umzug, einziehen, stellen, legen, haengen, wand, fenster, bild, schwer, mitte]

      - type: task
        id: b
        skills: [lesen, grammatik]
        rubric:
          de: "Wohin? oder Wo? Lies noch einmal und ergänze die Artikel."
          en: "Wohin? or Wo? Read again and fill in the articles."
          tr: "Wohin? mı, Wo? mu? Tekrar oku ve artikelleri tamamla."
        points: 6
        body:
          - type: table_fill
            first_col_head: false
            head: ["Wohin? → Akkusativ", "Wo? ● Dativ"]
            rows:
              - ["Das Sofa kommt an [[die]] Wand.", "Es steht an [[der]] Wand."]
              - ["Der Teppich kommt vor [[das]] Sofa.", "Er liegt vor [[dem]] Sofa."]
              - ["Das Bild kommt über [[das]] Sofa.", "Es hängt über [[dem]] Sofa."]
        notes:
          - kind: sogehts
            text:
              en: "Ask yourself first: {de:Wohin?} (movement → accusative) or {de:Wo?} (position → dative)."
              tr: "Önce kendine sor: {de:Wohin?} (hareket → Akkusativ) mi, {de:Wo?} (konum → Dativ) mu?"

      - type: box
        body:
          - type: grammar_box
            title: Wechselpräpositionen
            first_col_head: true
            head: ["", "Wohin? → Akkusativ", "Wo? ● Dativ"]
            rows:
              - ["{der Tisch}", "auf ==den== Tisch", "auf ==dem== Tisch"]
              - ["{das Sofa}", "neben ==das== Sofa", "neben ==dem== Sofa"]
              - ["{die Wand}", "an ==die== Wand", "an ==der== Wand"]
              - ["{p:die Fenster}", "zwischen ==die== Fenster", "zwischen ==den== Fenster==n=="]
            lines:
              - "**stellen** → stehen · **legen** → liegen · **hängen** → hängen"
            note: "in + dem = **im** · an + dem = **am** · in + das = **ins**"
            rule:
              en: "{de:in, an, auf, unter, über, vor, hinter, neben, zwischen}: accusative for movement to a place ({de:Wohin?}), dative for a position ({de:Wo?})."
              tr: "{de:in, an, auf, unter, über, vor, hinter, neben, zwischen}: bir yere doğru hareket varsa ({de:Wohin?}) Akkusativ, bir yerde bulunma varsa ({de:Wo?}) Dativ."
        notes:
          - kind: tipp
            text:
              en: "A memory hook: {de:Akkusativ} = {de:Aktion} (something moves). {de:Dativ} = {de:da} (it is already there)."
              tr: "Akılda tutmak için: {de:Akkusativ} = {de:Aktion} (bir şey hareket ediyor). {de:Dativ} = {de:da} (zaten orada duruyor)."

      - type: task
        id: c
        skills: [grammatik]
        rubric:
          de: "stellen oder stehen? legen oder liegen? Ergänze in der richtigen Form."
          en: "stellen or stehen? legen or liegen? Fill in the correct form."
          tr: "stellen mi stehen mi? legen mi liegen mi? Doğru biçimde tamamla."
        points: 5
        body:
          - type: gap_text
            items:
              - "Ich [[stelle]] die Blumen auf den Tisch."
              - "Jetzt [[stehen]] die Blumen auf dem Tisch."
              - "Elif [[legt]] das Handy auf das Regal."
              - "Das Handy [[liegt]] auf dem Regal."
              - "Die Bücher [[stehen]] schon im Regal."
        words: [stehen, liegen]

      - type: task
        id: d
        skills: [grammatik]
        rubric:
          de: "Akkusativ oder Dativ? Kreuze an."
          en: "Accusative or dative? Tick the right form."
          tr: "Akkusativ mi, Dativ mi? Doğru biçimi işaretle."
        points: 6
        body:
          - type: gap_text
            items:
              - "Die Katze liegt unter {?den|dem*} Tisch."
              - "Stell den Stuhl bitte neben {?das*|dem} Bett."
              - "Der Spiegel hängt {?in den|im*} Flur."
              - "Wir hängen die Lampe über {?den*|dem} Tisch."
              - "Das Regal steht zwischen {?den|dem*} Schrank und der Tür."
              - "Leg die Zeitung bitte auf {?das*|dem} Sofa."
        words: [schrank, stuhl, tuer]

      - type: box
        body:
          - type: typical_mistake
            wrong: "Ich stelle die Lampe auf dem Tisch."
            right: "Ich stelle die Lampe auf ==den== Tisch."
            why:
              en: "{de:stellen} is a movement: {de:Wohin?} → accusative. The dative only says where something already is."
              tr: "{de:stellen} bir harekettir: {de:Wohin?} → Akkusativ. Dativ yalnızca bir şeyin zaten nerede durduğunu söyler."

  # ═══ 5 · HAUPTTEIL C ═══════════════════════════════════════ pages 108–109 ═══
  - nr: 5
    section: hauptteil
    title: Die Heizung bleibt kalt
    subtitle: {en: "Reporting a problem to the property management", tr: "Bina yönetimine bir sorunu bildirmek"}
    blocks:
      - type: task
        id: a
        skills: [hoeren, lesen]
        rubric:
          de: "Elif ruft die Hausverwaltung an. Hör das Telefongespräch und lies mit."
          en: "Elif calls the property management. Listen to the phone call and read along."
          tr: "Elif bina yönetimini arıyor. Telefon görüşmesini dinle ve metni takip et."
        audio:
          track: "5.04"
          title: Anruf bei der Hausverwaltung
          duration: "0:52"
          transcript_from_body: true
        body:
          - type: dialogue
            turns:
              - {speaker: amina, text: "Hausverwaltung Nordstadt, Diallo. Was kann ich für Sie tun?"}
              - {speaker: elif, text: "Guten Morgen, hier ist Elif Demir aus der Lindenstraße 12. Meine Heizung funktioniert nicht. Wenn ich sie aufdrehe, bleibt sie kalt."}
              - {speaker: amina, text: "Oh, das tut mir leid. Ich schicke Ihnen unseren Hausmeister. Passt es Ihnen morgen um zehn Uhr?"}
              - {speaker: elif, text: "Morgen Vormittag arbeite ich leider. Wenn es möglich ist, lieber ab 15 Uhr."}
              - {speaker: amina, text: "Kein Problem. Dann kommt Herr Berger morgen um 15 Uhr."}
        answer:
          open: true
          note:
            en: "Listen and read along – nothing to check here."
            tr: "Dinle ve metni takip et – burada kontrol edilecek bir şey yok."
        notes:
          - kind: wort
            words: [aufdrehen, hausmeister]
            entries:
              - {de: "Passt es Ihnen …?", en: "Does … suit you?", tr: "… size uyar mı?"}
          - kind: landeskunde
            text:
              en: "Most blocks of flats in Germany are run by a {de:Hausverwaltung}. It organises repairs and sends the yearly bill for the service charges. Its phone number is usually on the notice board in the hallway."
              tr: "Almanya’da apartmanların çoğunu bir {de:Hausverwaltung} yönetir. Tamir işlerini ayarlar ve yıllık yan gider hesabını gönderir. Telefon numarası genellikle girişteki panoda yazar."
        words: [heizung, hausverwaltung, hausmeister, aufdrehen, funktionieren, melden]

      - type: task
        id: b
        skills: [lesen]
        rubric:
          de: "Richtig oder falsch? Kreuze an."
          en: "True or false? Tick the right box."
          tr: "Doğru mu, yanlış mı? İşaretle."
        points: 4
        body:
          - type: true_false
            items:
              - {text: "Elif wohnt in der Lindenstraße.", answer: true}
              - {text: "Die Heizung in Elifs Wohnung ist warm.", answer: false}
              - {text: "Frau Diallo schickt den Hausmeister.", answer: true}
              - {text: "Elif hat morgen Vormittag Zeit.", answer: false}

      - type: box
        body:
          - type: grammar_box
            title: wenn-Sätze
            head: ["Nebensatz · Verb am Ende", "Hauptsatz · Verb zuerst"]
            rows:
              - ["Wenn ich die Heizung ==aufdrehe==,", "==bleibt== sie kalt."]
              - ["Wenn Sie Zeit ==haben==,", "==kommen== Sie bitte um 15 Uhr."]
            rule:
              en: "{de:wenn}-clause: the verb goes to the end. The main clause after it starts with its verb."
              tr: "{de:wenn} cümlesinde fiil sonda durur. Ardından gelen ana cümle fiille başlar."
        notes:
          - kind: tipp
            text:
              en: "Say the sentence out loud. In the {de:wenn} part your voice goes up – and the verb waits at the very end."
              tr: "Cümleyi yüksek sesle söyle. {de:wenn} bölümünde sesin yükselir, fiil ise en sonda bekler."

      - type: task
        id: c
        skills: [grammatik, schreiben]
        rubric:
          de: "Ergänze die Verben in der richtigen Form."
          en: "Fill in the verbs in the correct form."
          tr: "Fiilleri doğru biçimde yaz."
        points: 4
        body:
          - type: gap_text
            bank: [nehmen, schließen, schreiben, sein]
            items:
              - "Wenn das Fenster nicht [[schließt]], [[schreibe]] ich eine E-Mail."
              - "Wenn der Aufzug kaputt [[ist]], [[nehmen]] wir die Treppe."
        words: [kaputt, schliessen, treppe]

      - type: box
        body:
          - type: typical_mistake
            wrong: "Wenn ich die Heizung aufdrehe, sie bleibt kalt."
            right: "Wenn ich die Heizung aufdrehe, ==bleibt sie== kalt."
            why:
              en: "After a {de:wenn}-clause, the main clause starts with the verb."
              tr: "{de:wenn} cümlesinden sonra ana cümle fiille başlar."

      - type: task
        id: d
        skills: [lesen]
        rubric:
          de: "Lies die E-Mail und kreuze an: A, B oder C?"
          en: "Read the email and tick A, B or C."
          tr: "E-postayı oku ve işaretle: A, B ya da C?"
        points: 3
        body:
          - type: reading_text
            id: mail
            genre: email
            meta:
              Von: elif.demir@post.example
              An: info@hv-nordstadt.example
              Betreff: Heizung defekt – Lindenstraße 12
            text: |
              Sehr geehrte Frau Diallo,

              ich wohne seit drei Monaten in der Lindenstraße 12, im dritten Stock links. Leider gibt es ein Problem: Die Heizung im Wohnzimmer funktioniert {#seit}seit Samstag nicht. Wenn ich sie aufdrehe, bleibt sie kalt.

              {#bitte}Können Sie bitte einen Handwerker schicken? {#zeit}Ich bin von Montag bis Mittwoch ab 15 Uhr zu Hause. Wenn Sie mich anrufen möchten, erreichen Sie mich unter 0171 3920045.

              Vielen Dank für Ihre Hilfe!

              Mit freundlichen Grüßen
              Elif Demir
          - type: multiple_choice
            items:
              - {q: "Seit wann ist die Heizung kalt? ({z:seit})", options: ["seit Samstag", "seit Montag", "seit drei Monaten"], answer: A}
              - {q: "Was soll die Hausverwaltung tun? ({z:bitte})", options: ["Elif anrufen", "einen Handwerker schicken", "eine neue Heizung kaufen"], answer: B}
              - {q: "Wann ist Elif zu Hause? ({z:zeit})", options: ["am Vormittag", "am Wochenende", "ab 15 Uhr"], answer: C}
        notes:
          - kind: sogehts
            text:
              en: "A formal email starts with {de:Sehr geehrte Frau …} or {de:Sehr geehrter Herr …} and ends with {de:Mit freundlichen Grüßen}. After the greeting, carry on in lower case."
              tr: "Resmî bir e-posta {de:Sehr geehrte Frau …} ya da {de:Sehr geehrter Herr …} ile başlar, {de:Mit freundlichen Grüßen} ile biter. Hitaptan sonra küçük harfle devam edilir."
          - kind: wort
            words: [erreichen, handwerker]
            entries:
              - {de: "defekt", en: "faulty", tr: "arızalı"}
        words: [handwerker, betreff, erreichen, problem]


