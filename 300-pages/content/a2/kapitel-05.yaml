  - nr: 6
    section: vertiefung
    title: Müll trennen
    subtitle: {en: "Sorting rubbish – and saying how things are done", tr: "Çöp ayırma – ve işlerin nasıl yapıldığını söylemek"}
    blocks:
      - type: task
        id: a
        skills: [lesen]
        rubric:
          de: "Lies den Aushang im Treppenhaus. Was kommt wohin? Ordne zu."
          en: "Read the notice in the stairwell. What goes where? Match."
          tr: "Merdiven boşluğundaki duyuruyu oku. Hangi çöp nereye atılır? Eşleştir."
        points: 5
        body:
          - type: reading_text
            id: aushang
            genre: notice
            title: Mülltrennung in unserem Haus
            text: |
              Liebe Mieterinnen und Mieter,

              bitte trennen Sie Ihren Müll richtig. So funktioniert es bei uns:

              {#papier}Papier und Kartons kommen in die blaue Tonne. Sie wird alle zwei Wochen am Mittwoch geleert. {#gelb}Verpackungen aus Plastik und Metall gehören in die gelbe Tonne. Sie wird am Freitag abgeholt. Obst- und Gemüsereste kommen in die braune Tonne. {#rest}Der Restmüll kommt in die graue Tonne. Sie wird jeden Dienstag geleert.

              Glas wird nicht abgeholt. Bitte bringen Sie Flaschen und Gläser zum Container in der Lindenstraße. Wenn eine Tonne voll ist, stellen Sie bitte keine Müllsäcke daneben.

              Vielen Dank!
              Ihre Hausverwaltung Nordstadt
          - type: matching
            left: ["alte Zeitungen", "ein Joghurtbecher", "Bananenschalen", "eine kaputte Tasse", "leere Weinflaschen"]
            right: ["die graue Tonne", "der Glascontainer", "die blaue Tonne", "die braune Tonne", "die gelbe Tonne"]
            answer: [C, E, D, A, B]
        notes:
          - kind: landeskunde
            text:
              en: "The colours of the bins differ from town to town, so always check the notice in your building. Many bottles and cans carry a deposit ({de:Pfand}): take them back to the supermarket and you get 8, 15 or 25 cents each."
              tr: "Bidonların renkleri şehirden şehre değişir; bu yüzden her zaman binandaki duyuruya bak. Birçok şişe ve kutuda depozito ({de:Pfand}) vardır: markete geri götürürsen tanesi için 8, 15 ya da 25 sent alırsın."
        words: [muell, tonne, aushang, trennen, verpackung, restmuell, flasche, glas, mieter, leeren, abholen, voll]

      - type: task
        id: b
        skills: [lesen]
        rubric:
          de: "Lies den Aushang noch einmal. Wann passiert was? Ergänze."
          en: "Read the notice again. What happens when? Fill in the days."
          tr: "Duyuruyu tekrar oku. Ne, ne zaman oluyor? Günleri yaz."
        points: 3
        body:
          - type: gap_text
            items:
              - "Die blaue Tonne wird am [[Mittwoch]] geleert. ({z:papier})"
              - "Die gelbe Tonne wird am [[Freitag]] abgeholt. ({z:gelb})"
              - "Die graue Tonne wird am [[Dienstag]] geleert. ({z:rest})"

      - type: box
        body:
          - type: grammar_box
            title: Passiv Präsens
            head: ["", "Position 2", "", "Ende"]
            rows:
              - ["Der Müll", "==wird==", "am Dienstag", "==abgeholt==."]
              - ["Die Tonnen", "==werden==", "jede Woche", "==geleert==."]
            lines:
              - "Aktiv: Die Müllabfuhr holt den Müll ab. → Passiv: Der Müll wird abgeholt."
            rule:
              en: "Use the passive when the action matters more than the person doing it: {de:werden} + past participle. {de:werden} is in position 2, the participle goes to the end."
              tr: "Kimin yaptığı değil de yapılan iş önemliyse edilgen çatı kullanılır: {de:werden} + Partizip II. {de:werden} ikinci sırada, Partizip II ise en sonda durur."
        notes:
          - kind: tipp
            text:
              en: "You already know the participle from the {de:Perfekt}: {de:hat abgeholt} → {de:wird abgeholt}."
              tr: "Partizip II’yi {de:Perfekt}’ten zaten biliyorsun: {de:hat abgeholt} → {de:wird abgeholt}."

      - type: task
        id: c
        skills: [grammatik]
        rubric:
          de: "Ergänze *wird* oder *werden* und das Partizip."
          en: "Fill in wird or werden and the participle."
          tr: "wird ya da werden ile Partizip II’yi yaz."
        points: 6
        body:
          - type: gap_text
            bank: [abgeholt, geleert, gebracht, getrennt, repariert, geputzt]
            items:
              - "Die gelbe Tonne [[wird]] am Freitag [[abgeholt]]."
              - "Die Tonnen [[werden]] jede Woche [[geleert]]."
              - "In Deutschland [[wird]] der Müll [[getrennt]]."
              - "Das Treppenhaus [[wird]] jeden Montag [[geputzt]]."
              - "Die Flaschen [[werden]] zum Container [[gebracht]]."
              - "Der Aufzug [[wird]] morgen [[repariert]]."
        words: [muellabfuhr, treppenhaus, putzen, reparieren, container, pfand]

      - type: box
        body:
          - type: typical_mistake
            wrong: "Der Müll wird am Dienstag abholen."
            right: "Der Müll wird am Dienstag ==abgeholt==."
            why:
              en: "Passive = {de:werden} + past participle (Partizip II), not the infinitive."
              tr: "Edilgen çatı = {de:werden} + Partizip II; mastar kullanılmaz."

      - type: task
        id: d
        skills: [schreiben]
        rubric:
          de: "Was wird in deinem Haus gemacht? Schreib drei Sätze im Passiv."
          en: "What gets done in your building? Write three sentences in the passive."
          tr: "Senin binanda neler yapılıyor? Edilgen çatıyla üç cümle yaz."
        body:
          - type: write_lines
            lines: 3
            model: "Bei uns wird der Müll am Montag abgeholt."
        answer:
          open: true
          model: "Bei uns wird der Müll am Montag abgeholt. Das Treppenhaus wird jede Woche geputzt. Die Fahrräder werden im Keller abgestellt."

  # ═══ 7 · VERTIEFUNG ════════════════════════════════════════ pages 112–113 ═══
  - nr: 7
    section: vertiefung
    title: Gute Nachbarn
    subtitle: {en: "Asking neighbours politely for help", tr: "Komşulardan kibarca yardım istemek"}
    blocks:
      - type: task
        id: a
        skills: [hoeren]
        rubric:
          de: "Elif klingelt bei Herrn Berger. Hör zu und kreuze an."
          en: "Elif rings Mr Berger’s doorbell. Listen and tick the right answer."
          tr: "Elif, Bay Berger’in zilini çalıyor. Dinle ve doğru cevabı işaretle."
        points: 3
        audio:
          track: "5.05"
          title: Bei Herrn Berger
          duration: "0:50"
          transcript:
            turns:
              - {speaker: elif, text: "Guten Abend, Herr Berger. Entschuldigen Sie die Störung."}
              - {speaker: david, text: "Guten Abend, Frau Demir. Kein Problem. Was kann ich für Sie tun?"}
              - {speaker: elif, text: "Ich möchte ein Bild aufhängen, aber ich habe keine Bohrmaschine. Könnten Sie mir vielleicht eine leihen?"}
              - {speaker: david, text: "Natürlich, einen Moment … Hier, bitte. Aber bohren Sie bitte nicht nach 20 Uhr. Sie wissen ja: die Hausordnung."}
              - {speaker: elif, text: "Selbstverständlich! Ich bringe sie Ihnen morgen zurück. Vielen Dank!"}
              - {speaker: david, text: "Gern geschehen. Und wenn Sie Hilfe brauchen, klingeln Sie einfach."}
        body:
          - type: multiple_choice
            items:
              - {q: "Elif braucht …", options: ["einen Hammer.", "eine Bohrmaschine.", "eine Leiter."], answer: B}
              - {q: "Elif soll nicht … bohren.", options: ["nach 20 Uhr", "am Samstag", "vor 8 Uhr"], answer: A}
              - {q: "Elif bringt die Bohrmaschine … zurück.", options: ["heute Abend", "am Wochenende", "morgen"], answer: C}
        notes:
          - kind: wort
            words: [leihen, bohrmaschine]
            entries:
              - {de: "Entschuldigen Sie die Störung.", en: "Sorry to disturb you.", tr: "Rahatsız ettiğim için özür dilerim."}
        words: [bohrmaschine, leihen, leiter, hausordnung, bohren, zurueckbringen, stoeren]

      - type: task
        id: b
        skills: [lesen]
        rubric:
          de: "Was ist höflicher? Kreuze an."
          en: "Which is more polite? Tick."
          tr: "Hangisi daha kibar? İşaretle."
        points: 3
        body:
          - type: multiple_choice
            items:
              - {q: "Du brauchst eine Leiter.", options: ["Geben Sie mir Ihre Leiter!", "Könnten Sie mir bitte Ihre Leiter leihen?"], answer: B}
              - {q: "Du hast keinen Zucker mehr.", options: ["Hätten Sie vielleicht etwas Zucker für mich?", "Ich brauche Zucker."], answer: A}
              - {q: "Die Musik ist zu laut.", options: ["Machen Sie die Musik leiser!", "Könnten Sie die Musik bitte etwas leiser machen?"], answer: B}
        notes:
          - kind: sogehts
            text:
              en: "{de:Könnten Sie …?} and {de:Hätten Sie …?} sound softer than {de:Können Sie …?} and {de:Haben Sie …?} Add {de:bitte} or {de:vielleicht} and you are on the safe side."
              tr: "{de:Könnten Sie …?} ve {de:Hätten Sie …?}, {de:Können Sie …?} ve {de:Haben Sie …?} kalıplarından daha yumuşaktır. Bir de {de:bitte} ya da {de:vielleicht} eklersen işini garantiye alırsın."

      - type: box
        body:
          - type: phrases
            title: Höflich bitten
            groups:
              - title: Bitten
                items:
                  - {de: "Könnten Sie mir bitte helfen?", en: "Could you help me, please?", tr: "Bana yardım edebilir misiniz lütfen?"}
                  - {de: "Könntest du mir deine Leiter leihen?", en: "Could you lend me your ladder?", tr: "Bana merdivenini ödünç verebilir misin?"}
                  - {de: "Hätten Sie vielleicht einen Moment Zeit?", en: "Would you have a moment?", tr: "Acaba bir dakikanız var mı?"}
                  - {de: "Darf ich Sie etwas fragen?", en: "May I ask you something?", tr: "Size bir şey sorabilir miyim?"}
              - title: Reagieren
                items:
                  - {de: "Ja, gern. · Natürlich.", en: "Yes, gladly. · Of course.", tr: "Evet, memnuniyetle. · Tabii."}
                  - {de: "Kein Problem.", en: "No problem.", tr: "Sorun değil."}
                  - {de: "Tut mir leid, das geht leider nicht.", en: "Sorry, I’m afraid that’s not possible.", tr: "Üzgünüm, maalesef olmaz."}
        notes:
          - kind: landeskunde
            text:
              en: "With neighbours you don’t know yet, start with {de:Sie}. Many will soon offer the {de:du}: {de:„Wir können uns gern duzen.“}"
              tr: "Henüz tanımadığın komşulara {de:Sie} diye hitap et. Çoğu kısa sürede {de:du} demeyi teklif eder: {de:„Wir können uns gern duzen.“}"

      - type: task
        id: c
        skills: [lesen]
        rubric:
          de: "Lies die Zettel im Treppenhaus. Richtig oder falsch?"
          en: "Read the notes in the stairwell. True or false?"
          tr: "Merdiven boşluğundaki notları oku. Doğru mu, yanlış mı?"
        points: 4
        body:
          - type: reading_text
            genre: note
            line_numbers: false
            parts:
              - label: "1"
                text: "Liebe Nachbarn, am Samstag feiere ich Geburtstag. Es kann etwas lauter werden. Wenn es Sie stört, klingeln Sie einfach – oder kommen Sie vorbei!"
                author: "Maria Lorenz, 2. Stock"
              - label: "2"
                text: "Wer kann mir helfen? Ich ziehe am 1. Mai aus und suche zwei Personen für den Umzug. Es gibt Pizza für alle!"
                author: "Yusuf, 4. Stock"
          - type: true_false
            items:
              - {text: "Maria macht am Samstag eine Party.", answer: true}
              - {text: "Die Nachbarn dürfen nicht zu Maria kommen.", answer: false}
              - {text: "Yusuf zieht in das Haus ein.", answer: false}
              - {text: "Yusuf sucht Hilfe für seinen Umzug.", answer: true}
        words: [zettel, feiern, ausziehen, vorbeikommen]

      - type: task
        id: d
        skills: [schreiben]
        rubric:
          de: "Du fährst in den Urlaub. Schreib deiner Nachbarin einen Zettel."
          en: "You’re going on holiday. Write a note to your neighbour."
          tr: "Tatile gidiyorsun. Komşuna bir not yaz."
        body:
          - type: write_lines
            lines: 2
            prompts: ["Wann bist du weg?", "Bitte: Blumen gießen", "Wo ist der Schlüssel?"]
            model: "Liebe Frau Lorenz, ab Montag bin ich zwei Wochen im Urlaub."
        answer:
          open: true
          model: "Liebe Frau Lorenz, ab Montag bin ich zwei Wochen im Urlaub. Könnten Sie bitte meine Blumen gießen? Der Schlüssel liegt bei Herrn Berger. Vielen Dank und liebe Grüße, Elif Demir"
        words: [giessen, schluessel]

      - type: task
        id: e
        skills: [sprechen, partner]
        rubric:
          de: "Spielt ein Gespräch im Treppenhaus. Tauscht danach die Rollen."
          en: "Act out a conversation in the stairwell. Then swap roles."
          tr: "Merdiven boşluğunda geçen bir konuşmayı canlandırın. Sonra rolleri değiştirin."
        body:
          - type: role_cards
            cards:
              - label: A
                title: Du brauchst Hilfe
                points: ["Dein Internet funktioniert nicht.", "Du möchtest kurz das WLAN benutzen."]
              - label: B
                title: Du wohnst nebenan
                points: ["Reagiere freundlich.", "Sag Ja – oder erkläre, warum es nicht geht."]
        answer:
          open: true
          model: "Entschuldigen Sie die Störung. Mein Internet funktioniert nicht. Dürfte ich vielleicht kurz Ihr WLAN benutzen? – Ja, gern. Kein Problem. Das Passwort steht hier."

  # ═══ 8 · VERTIEFUNG ════════════════════════════════════════ pages 114–115 ═══
  - nr: 8
    section: vertiefung
    title: Das Repair-Café
    subtitle: {en: "Repairing instead of throwing away", tr: "Atmak yerine tamir etmek"}
    blocks:
      - type: box
        body:
          - type: image
            id: k5-repaircafe
            focus: 30
            src: assets/images/a2/k5-repaircafe.jpg
            format: strip
            description: "Im Repair-Café: Yusuf und eine ältere Nachbarin reparieren zusammen einen Toaster an einem langen Tisch voller Werkzeug. Im Hintergrund Kaffee, Kuchen und ein Fahrrad auf einem Montageständer."
            alt:
              en: "At the repair café, Yusuf and an older neighbour repair a toaster together at a long table full of tools."
              tr: "Repair-Café’de Yusuf ve yaşlı bir komşu, aletlerle dolu uzun bir masada birlikte bir tost makinesi tamir ediyor."

      - type: task
        id: a
        skills: [lesen]
        rubric:
          de: "Lies den Artikel. Was ist richtig? Kreuze an."
          en: "Read the article. What is correct? Tick."
          tr: "Makaleyi oku. Hangisi doğru? İşaretle."
        points: 4
        body:
          - type: reading_text
            id: artikel
            genre: article
            kicker: Nachbarschaft
            title: Reparieren statt wegwerfen
            text: |
              Der Toaster funktioniert nicht mehr, die Lampe bleibt dunkel, das Fahrrad hat einen Platten – was nun? Viele Leute werfen kaputte Sachen einfach weg. In der Nordstadt gibt es eine bessere Idee: das Repair-Café.

              {#wann}Jeden ersten Samstag im Monat treffen sich hier Nachbarn im Stadtteilzentrum. Wer etwas Kaputtes hat, bringt es mit. Am Eingang wird jedes Gerät zuerst angemeldet. {#wer}Dann wird es zusammen mit einem Helfer repariert. „Wir reparieren nicht für die Leute, sondern mit den Leuten“, sagt Yusuf. Der Handwerker hilft seit einem Jahr im Repair-Café.

              {#kosten}Die Reparatur kostet nichts. Wenn man möchte, kann man etwas spenden. Kaffee und Kuchen gibt es auch. {#kofi}„Wenn ein Gerät wieder funktioniert, freuen sich alle“, sagt Yusuf. „Und der Müll wird weniger.“
          - type: multiple_choice
            items:
              - {q: "Wann findet das Repair-Café statt? ({z:wann})", options: ["jeden Samstag", "einmal im Monat", "jeden Tag"], answer: B}
              - {q: "Wer repariert die Geräte? ({z:wer})", options: ["nur die Helfer", "die Besucher allein", "Besucher und Helfer zusammen"], answer: C}
              - {q: "Was kostet die Reparatur? ({z:kosten})", options: ["nichts", "fünf Euro", "einen Kuchen"], answer: A}
              - {q: "Was passiert, wenn ein Gerät wieder funktioniert? ({z:kofi})", options: ["Man muss bezahlen.", "Alle freuen sich.", "Es gibt Kuchen."], answer: B}
        notes:
          - kind: wort
            words: [geraet, wegwerfen, spenden, eingang]
            entries:
              - {de: "einen Platten haben", en: "to have a flat tyre", tr: "lastiği patlak olmak"}
              - {de: "statt", en: "instead of", tr: "yerine"}
        words: [geraet, wegwerfen, reparatur, helfer, spenden, stadtteil, anmelden, mitbringen, eingang]

      - type: task
        id: b
        skills: [hoeren]
        rubric:
          de: "Hör das Interview mit Yusuf. Richtig oder falsch?"
          en: "Listen to the interview with Yusuf. True or false?"
          tr: "Yusuf ile yapılan röportajı dinle. Doğru mu, yanlış mı?"
        points: 5
        audio:
          track: "5.06"
          title: Interview im Repair-Café
          duration: "1:02"
          transcript:
            turns:
              - {speaker: reporterin, text: "Yusuf, was wird im Repair-Café am häufigsten repariert?"}
              - {speaker: yusuf, text: "Kaffeemaschinen und Lampen. Aber auch Fahrräder und Handys werden oft gebracht."}
              - {speaker: reporterin, text: "Kann man alles reparieren?"}
              - {speaker: yusuf, text: "Nein, leider nicht. Wenn ein Ersatzteil fehlt, können wir nichts machen. Aber ungefähr sechzig Prozent der Geräte funktionieren danach wieder."}
              - {speaker: reporterin, text: "Warum machst du das?"}
              - {speaker: yusuf, text: "Ich repariere gern, und ich lerne hier viele Nachbarn kennen. Außerdem ist es gut für die Umwelt."}
              - {speaker: reporterin, text: "Wann ist das nächste Repair-Café?"}
              - {speaker: yusuf, text: "Am ersten Samstag im Mai, von 14 bis 17 Uhr."}
        body:
          - type: true_false
            items:
              - {text: "Am häufigsten werden Fahrräder repariert.", answer: false}
              - {text: "Man kann nicht alles reparieren.", answer: true}
              - {text: "Ungefähr 60 Prozent der Geräte funktionieren danach wieder.", answer: true}
              - {text: "Yusuf findet das Repair-Café gut für die Umwelt.", answer: true}
              - {text: "Das nächste Repair-Café ist am Vormittag.", answer: false}
        notes:
          - kind: landeskunde
            text:
              en: "There are more than a thousand repair cafés in Germany. Volunteers help for free; you only pay for spare parts."
              tr: "Almanya’da binden fazla Repair-Café var. Gönüllüler ücretsiz yardım eder; sadece yedek parçanın parasını ödersin."
        words: [ersatzteil, umwelt, haeufig, fehlen, kennenlernen]

      - type: task
        id: c
        skills: [grammatik, schreiben]
        rubric:
          de: "Was wird im Repair-Café gemacht? Schreib Sätze im Passiv."
          en: "What gets done at the repair café? Write sentences in the passive."
          tr: "Repair-Café’de neler yapılıyor? Edilgen çatıyla cümleler yaz."
        points: 3
        body:
          - type: sentence_build
            example: {given: "die Geräte / anmelden", answer: "Die Geräte werden angemeldet."}
            items:
              - {given: "die Fahrräder / reparieren", answer: "Die Fahrräder werden repariert."}
              - {given: "Kaffee / trinken", answer: "Kaffee wird getrunken."}
              - {given: "Geld / spenden", answer: "Geld wird gespendet."}

      - type: task
        id: d
        skills: [sprechen, partner]
        rubric:
          de: "Und du? Sprecht zu zweit."
          en: "And you? Talk in pairs."
          tr: "Ya sen? İkişerli konuşun."
        body:
          - type: bubbles
            items: ["Was reparierst du selbst?", "Was wirfst du weg, wenn es kaputt ist?", "Gibt es in deiner Stadt ein Repair-Café?"]
        answer:
          open: true
          model: "Ich repariere mein Fahrrad selbst. Wenn mein Handy kaputt ist, bringe ich es in ein Geschäft. In meiner Stadt gibt es ein Repair-Café, aber ich war noch nie dort."

      - type: task
        id: e
        skills: [schreiben]
        rubric:
          de: "Was machst du, wenn etwas kaputt ist? Schreib zwei Sätze mit *wenn*."
          en: "What do you do when something is broken? Write two sentences with wenn."
          tr: "Bir şey bozulduğunda ne yaparsın? wenn ile iki cümle yaz."
        body:
          - type: write_lines
            lines: 2
            model: "Wenn mein Fahrrad kaputt ist, repariere ich es selbst."
        answer:
          open: true
          model: "Wenn mein Fahrrad kaputt ist, repariere ich es selbst. Wenn mein Handy nicht mehr funktioniert, bringe ich es ins Repair-Café."

  # ═══ 9 · VERTIEFUNG ════════════════════════════════════════ pages 116–117 ═══
  - nr: 9
    section: vertiefung
    title: Grammatik-Training
    subtitle: {en: "Practise the grammar of this chapter", tr: "Bu ünitenin dil bilgisini pekiştir"}
    blocks:
      - type: task
        id: a
        skills: [grammatik]
        rubric:
          de: "Akkusativ oder Dativ? Kreuze an."
          en: "Accusative or dative? Tick the right form."
          tr: "Akkusativ mi, Dativ mi? Doğru biçimi işaretle."
        points: 6
        body:
          - type: gap_text
            items:
              - "Die Zeitung liegt auf {?den|dem*} Tisch."
              - "Elif hängt die Jacke in {?den*|dem} Schrank."
              - "Wir stellen das Bett an {?die*|der} Wand."
              - "Der Fernseher steht zwischen {?die|den*} Fenstern."
              - "Leg das Buch bitte {?ins*|im} Regal."
              - "Das Fahrrad steht {?in den|im*} Keller."
        notes:
          - kind: sogehts
            text:
              en: "First find the verb. {de:stellen}, {de:legen}, {de:hängen} with an object → {de:Wohin?} {de:stehen}, {de:liegen} → {de:Wo?}"
              tr: "Önce fiili bul. Nesneyle kullanılan {de:stellen}, {de:legen}, {de:hängen} → {de:Wohin?} {de:stehen}, {de:liegen} → {de:Wo?}"

      - type: task
        id: b
        skills: [grammatik, schreiben]
        rubric:
          de: "Verbinde die Sätze mit *wenn*."
          en: "Join the sentences with wenn."
          tr: "Cümleleri wenn ile bağla."
        points: 6
        body:
          - type: sentence_build
            example: {given: "Die Heizung ist kaputt. Ich rufe den Hausmeister an.", answer: "Wenn die Heizung kaputt ist, rufe ich den Hausmeister an."}
            items:
              - {given: "Du brauchst Hilfe. Du kannst bei mir klingeln.", answer: "Wenn du Hilfe brauchst, kannst du bei mir klingeln."}
              - {given: "Die Tonne ist voll. Wir bringen den Müll zum Container.", answer: "Wenn die Tonne voll ist, bringen wir den Müll zum Container."}
              - {given: "Es wird zu laut. Die Nachbarn sind sauer.", answer: "Wenn es zu laut wird, sind die Nachbarn sauer."}
        notes:
          - kind: tipp
            text:
              en: "Don’t forget the comma! In German there is always a comma between the {de:wenn}-clause and the main clause."
              tr: "Virgülü unutma! Almancada {de:wenn} cümlesi ile ana cümle arasına her zaman virgül konur."
