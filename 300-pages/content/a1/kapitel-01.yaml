number: 1
title: Hallo!
subtitle_de: Sich begrüßen und vorstellen
subtitle:
  en: Greeting people and introducing yourself
  tr: Selamlaşmak ve kendini tanıtmak
goal:
  de: Du stellst dich vor, begrüßt andere und stellst einfache Fragen zu Name und Wohnort.
  en: Introduce yourself, greet other people and ask simple questions about name and home town.
  tr: Kendini tanıtırsın, başkalarını selamlarsın ve ad ile yaşanılan yer hakkında basit sorular sorarsın.
can_do:
