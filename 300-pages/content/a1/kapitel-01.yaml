    en: I can introduce myself and others.
    tr: Kendimi ve başkalarını tanıtabilirim.
    ref: '1.2'
  - de: Ich kann nach Name und Wohnort fragen.
    en: I can ask for name and home town.
    tr: Ad ve yaşanılan yeri sorabilirim.
    ref: '1.14'
  - de: Ich kann sagen, woher ich komme.
    en: I can say where I come from.
    tr: Nereli olduğumu söyleyebilirim.
