  - nr: 5
    section: hauptteil
    title: heißen und wohnen
    subtitle:
      en: The verbs “heißen” and “wohnen”
      tr: “heißen” ve “wohnen” fiilleri
    blocks:
      - type: box
        body:
          - type: grammar_box
            title: ''
            intro:
              en: 'The verbs {de:heißen} and {de:wohnen} are almost regular. The ending {de:-st} goes with {de:du}, the ending {de:-t} with {de:er/sie/es}. Present tense: {de:ich heiße,
                du heißt, er/sie/es heißt; ich wohne, du wohnst, er/sie/es wohnt}.'
              tr: '{de:heißen} ve {de:wohnen} fiilleri neredeyse düzenlidir. {de:du} ile {de:-st}, {de:er/sie/es} ile {de:-t} eki kullanılır. Şimdiki zaman: {de:ich heiße, du heißt,
                er/sie/es heißt; ich wohne, du wohnst, er/sie/es wohnt}.'
            lines:
              - Du wohnst in Hamburg.
              - Er heißt Tobias.
              - Sie wohnt in Wien.
        notes:
          - type: margin_note
            kind: tipp
            text:
              en: 'The ending shows the person: {de:-e} for {de:ich}, {de:-st} for {de:du}, {de:-t} for {de:er}, {de:sie} and {de:es}.'
              tr: 'Ek, kişiyi gösterir: {de:ich} için {de:-e}, {de:du} için {de:-st}, {de:er}, {de:sie} ve {de:es} için {de:-t}.'
